[package]
name = "markitdown-desktop"
version = "0.1.0"
description = "Cross-platform document to Markdown client"
authors = ["you"]
edition = "2021"

[lib]
name = "markitdown_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
